name: Freemchost Auto Renew Permanent

on:
  schedule:
    - cron: '10 */6 * * *'
  workflow_dispatch:

# 必须添加 actions: write 权限，用于清理历史 Workflow Runs
permissions:
  actions: write
  contents: read

jobs:
  browser-auto-renew:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_LINK: ${{ secrets.NODE_LINK }}

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 缓存 Playwright 浏览器依赖
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-v1

      - name: 安装 Playwright 及依赖
        run: |
          npm init -y
          npm install playwright
          npx playwright install chromium --with-deps

      - name: ⚙️ 部署 Mihomo 代理内核 (解析多协议节点)
        if: ${{ env.NODE_LINK != '' }}
        run: |
          echo "🔄 识别到 NODE_LINK，开始部署本地代理转换层..."
          
          # 1. 保存节点链接并启动临时 HTTP 服务供转换器读取
          echo "$NODE_LINK" > node.txt
          python3 -m http.server 8080 &
          
          # 2. 下载并启动 Subconverter 节点解析器 (全本地运行)
          wget -qO sub.tar.gz https://github.com/tindy2013/subconverter/releases/latest/download/subconverter_linux64.tar.gz
          tar -xf sub.tar.gz
          nohup ./subconverter/subconverter > sub.log 2>&1 &
          sleep 2
          
          # 3. 下载并部署 Mihomo (Clash Meta) 内核
          wget -qO mihomo.gz https://github.com/MetaCubeX/mihomo/releases/download/v1.18.2/mihomo-linux-amd64-v1.18.2.gz
          gunzip mihomo.gz
          chmod +x mihomo
          
          # 4. 生成 Clash 配置并配置 SOCKS5 监听端口
          curl -s "http://127.0.0.1:25500/sub?target=clash&url=http://127.0.0.1:8080/node.txt&insert=false" > config.yaml
          sed -i '1i\socks-port: 7891\nallow-lan: true\nmode: global' config.yaml
          
          # 5. 后台启动 Mihomo 代理内核
          nohup ./mihomo -d . -f config.yaml > mihomo.log 2>&1 &
          sleep 3
          
          # 6. 端口连通性检查
          if nc -z 127.0.0.1 7891; then
            echo "✅ 代理内核启动完毕！已成功桥接本地 SOCKS5 代理端口: 127.0.0.1:7891"
          else
            echo "⚠️ 警告: 代理端口 7891 未成功响应，请检查节点格式或 Mihomo 日志："
            cat mihomo.log
          fi

      - name: 执行自动化续期脚本
        env:
          FREE_EMAIL: ${{ secrets.FREE_EMAIL }}
          FREE_PASSWORD: ${{ secrets.FREE_PASSWORD }}
          SERVER_PAGE_URL: ${{ secrets.SERVER_PAGE_URL }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          # 若配置了 NODE_LINK 且 PROXY_URL 未手动指定，则自动使用本地 SOCKS5 代理服务
          PROXY_URL: ${{ secrets.PROXY_URL || (env.NODE_LINK != '' && 'socks5://127.0.0.1:7891' || '') }}
        run: node renew.js

      - name: 上传运行截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Freemchost-Screenshots-${{ github.run_number }}
          path: screenshots/*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: 🧹 删除旧的工作流记录 (保留最新 1 条)
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0      
          keep_minimum_runs: 1
