name: Freemchost Auto Renew Permanent

on:
  schedule:
    - cron: '10 */6 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  browser-auto-renew:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_LINK: ${{ secrets.NODE_LINK }}

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 缓存 Playwright 浏览器依赖
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-v1

      - name: 安装 Playwright 及依赖
        run: |
          npm init -y
          npm install playwright
          npx playwright install chromium --with-deps

      - name: ⚙️ 部署 Mihomo 代理内核 (双引擎全协议支持)
        if: ${{ env.NODE_LINK != '' }}
        run: |
          echo "🔄 识别到 NODE_LINK，开始部署本地代理转换层..."
          
          # 1. 保存节点链接并启动临时本地 HTTP 服务
          echo "$NODE_LINK" > node.txt
          python3 -m http.server 8080 &
          
          # 2. 下载并启动 Subconverter
          wget -qO sub.tar.gz https://github.com/tindy2013/subconverter/releases/latest/download/subconverter_linux64.tar.gz
          tar -xf sub.tar.gz
          nohup ./subconverter/subconverter > sub.log 2>&1 &
          sleep 2
          
          # 3. 下载并部署 Mihomo (Clash Meta) 内核
          wget -qO mihomo.gz https://github.com/MetaCubeX/mihomo/releases/download/v1.18.2/mihomo-linux-amd64-v1.18.2.gz
          gunzip mihomo.gz
          chmod +x mihomo
          
          # 4. 生成 Python 解析脚本并执行
          cat << 'EOF' > parse_node.py
import os, sys, urllib.parse, urllib.request, base64, json

node_link = os.environ.get("NODE_LINK", "").strip()

def try_subconverter():
    try:
        url = "http://127.0.0.1:25500/sub?target=clash&url=http://127.0.0.1:8080/node.txt&insert=false"
        req = urllib.request.urlopen(url, timeout=5)
        res = req.read().decode("utf-8", errors="ignore")
        if "proxies:" in res and "name:" in res:
            return res
    except Exception:
        pass
    return None

def parse_raw_link(link):
    link = link.strip()
    if link.startswith("socks5://") or link.startswith("socks://"):
        u = urllib.parse.urlparse(link)
        return {"name": "node", "type": "socks5", "server": u.hostname, "port": u.port or 1080, "username": u.username or "", "password": u.password or ""}
    elif link.startswith("hysteria2://") or link.startswith("hy2://"):
        url_str = link.replace("hy2://", "hysteria2://")
        u = urllib.parse.urlparse(url_str)
        qs = urllib.parse.parse_qs(u.query)
        pwd = u.username or (u.netloc.split("@")[0] if "@" in u.netloc else "")
        pwd = pwd.split(":")[0] if ":" in pwd else pwd
        n = {"name": "node", "type": "hysteria2", "server": u.hostname, "port": u.port or 443, "password": pwd}
        if "sni" in qs: n["sni"] = qs["sni"][0]
        if "insecure" in qs and qs["insecure"][0] in ["1", "true"]: n["skip-cert-verify"] = True
        return n
    elif link.startswith("tuic://"):
        u = urllib.parse.urlparse(link)
        qs = urllib.parse.parse_qs(u.query)
        uinfo = (u.username or "").split(":")
        n = {"name": "node", "type": "tuic", "server": u.hostname, "port": u.port or 443, "uuid": uinfo[0], "password": uinfo[1] if len(uinfo)>1 else "", "congestion-controller": qs.get("congestion_control", ["bbr"])[0]}
        if "sni" in qs: n["sni"] = qs["sni"][0]
        if "insecure" in qs and qs["insecure"][0] in ["1", "true"]: n["skip-cert-verify"] = True
        return n
    elif link.startswith("vless://"):
        u = urllib.parse.urlparse(link)
        qs = urllib.parse.parse_qs(u.query)
        sec = qs.get("security", [""])[0]
        n = {"name": "node", "type": "vless", "server": u.hostname, "port": u.port or 443, "uuid": u.username, "tls": sec in ["tls", "reality"], "network": qs.get("type", ["tcp"])[0]}
        if "sni" in qs: n["servername"] = qs["sni"][0]
        if "fp" in qs: n["client-fingerprint"] = qs["fp"][0]
        if sec == "reality":
            n["reality-opts"] = {"public-key": qs.get("pbk", [""])[0]}
            if "sid" in qs: n["reality-opts"]["short-id"] = qs["sid"][0]
        if n["network"] == "ws":
            n["ws-opts"] = {"path": qs.get("path", ["/"])[0]}
            if "host" in qs: n["ws-opts"]["headers"] = {"Host": qs["host"][0]}
        elif n["network"] == "grpc":
            n["grpc-opts"] = {"grpc-service-name": qs.get("serviceName", [""])[0]}
        return n
    elif link.startswith("vmess://"):
        b64 = link[8:]
        b64 += "=" * (-len(b64) % 4)
        data = json.loads(base64.b64decode(b64).decode("utf-8"))
        n = {"name": "node", "type": "vmess", "server": data.get("add"), "port": int(data.get("port", 443)), "uuid": data.get("id"), "alterId": int(data.get("aid", 0)), "cipher": "auto", "tls": data.get("tls") == "tls", "network": data.get("net", "tcp")}
        if data.get("sni"): n["servername"] = data["sni"]
        if n["network"] == "ws":
            n["ws-opts"] = {"path": data.get("path", "/")}
            if data.get("host"): n["ws-opts"]["headers"] = {"Host": data["host"]}
        return n
    elif link.startswith("trojan://"):
        u = urllib.parse.urlparse(link)
        qs = urllib.parse.parse_qs(u.query)
        n = {"name": "node", "type": "trojan", "server": u.hostname, "port": u.port or 443, "password": u.username}
        if "sni" in qs: n["sni"] = qs["sni"][0]
        if "allowInsecure" in qs and qs["allowInsecure"][0] in ["1", "true"]: n["skip-cert-verify"] = True
        return n
    return None

sub_res = try_subconverter()
if sub_res:
    print("✅ Subconverter 转换成功！")
    config_str = "socks-port: 7891\nallow-lan: true\nmode: global\n" + sub_res
else:
    print("⚠️ Subconverter 无法识别该节点，已自动切换至 Python 原生全协议解析器...")
    node_obj = parse_raw_link(node_link)
    if not node_obj:
        print("❌ 无法识别 NODE_LINK 的 URL 格式！")
        sys.exit(1)
    
    config_str = "socks-port: 7891\nallow-lan: true\nmode: global\nproxies:\n"
    for k, v in node_obj.items():
        if isinstance(v, dict):
            config_str += f"  - {k}:\n"
            for subk, subv in v.items():
                config_str += f"      {subk}: {json.dumps(subv)}\n"
        else:
            if k == "name":
                config_str += f"  - name: {json.dumps(v)}\n"
            else:
                config_str += f"    {k}: {json.dumps(v)}\n"

with open("config.yaml", "w") as f:
    f.write(config_str)
print("✅ Mihomo 配置文件 config.yaml 生成完毕！")
EOF
          python3 parse_node.py
          
          # 5. 后台启动 Mihomo 代理内核
          nohup ./mihomo -d . -f config.yaml > mihomo.log 2>&1 &
          sleep 4
          
          # 6. 端口与连通性检查
          if nc -z 127.0.0.1 7891; then
            echo "✅ 代理内核启动完毕！已成功桥接本地 SOCKS5 代理端口: 127.0.0.1:7891"
          else
            echo "❌ 代理内核启动失败，7891 端口未响应！排查日志："
            cat config.yaml
            cat mihomo.log
            exit 1
          fi

      - name: 执行自动化续期脚本
        env:
          FREE_EMAIL: ${{ secrets.FREE_EMAIL }}
          FREE_PASSWORD: ${{ secrets.FREE_PASSWORD }}
          SERVER_PAGE_URL: ${{ secrets.SERVER_PAGE_URL }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          PROXY_URL: ${{ secrets.PROXY_URL || (env.NODE_LINK != '' && 'socks5://127.0.0.1:7891' || '') }}
        run: node renew.js

      - name: 上传运行截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Freemchost-Screenshots-${{ github.run_number }}
          path: screenshots/*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: 🧹 删除旧的工作流记录 (保留最新 1 条)
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0      
          keep_minimum_runs: 1
